# Local copy of the FraudGuard theme, used when running from inside this folder
# (`cd streamlit_app && streamlit run app.py`) and by the streamlit_app Docker
# image. Keep in sync with the repo-root .streamlit/config.toml, which is what
# Streamlit Community Cloud actually reads.
[theme]
base = "dark"
primaryColor = "#38bdf8"              # cyan accent — active nav, focus rings, primary actions
backgroundColor = "#0d1117"           # near-black page background
secondaryBackgroundColor = "#161b22"  # card / sidebar surface
textColor = "#e6edf3"                 # off-white primary text
font = "sans serif"

[server]
headless = true
